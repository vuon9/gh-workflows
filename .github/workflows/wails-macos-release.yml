name: Wails macOS Release

on:
  workflow_call:
    inputs:
      app-name:
        description: Display name of the macOS app bundle.
        required: true
        type: string
      bundle-id:
        description: macOS app bundle identifier.
        required: true
        type: string
      team-id:
        description: Apple Developer Team ID.
        required: true
        type: string
      working-directory:
        description: Caller repository working directory.
        required: false
        type: string
        default: .
      package-command:
        description: Command that builds a release .app bundle.
        required: true
        type: string
      app-path:
        description: Path to the built .app bundle, relative to working-directory.
        required: true
        type: string
      dmg-name:
        description: DMG file name to create.
        required: true
        type: string
      artifact-name:
        description: GitHub Actions artifact name.
        required: false
        type: string
        default: wails-macos-release
      runner-label:
        description: GitHub-hosted or self-hosted macOS runner label.
        required: false
        type: string
        default: macos-26
      go-version-file:
        description: Optional Go version file path relative to working-directory.
        required: false
        type: string
        default: ""
      go-version:
        description: Go version to install when go-version-file is not set.
        required: false
        type: string
        default: "1.25.0"
      bun-version:
        description: Bun version to install.
        required: false
        type: string
        default: latest
      task-version:
        description: Go Task version to install.
        required: false
        type: string
        default: v3.49.0
      upload-github-release:
        description: Upload the signed DMG to a GitHub Release on tag builds.
        required: false
        type: boolean
        default: true
      github-release-prerelease:
        description: Mark the GitHub Release as a prerelease when uploading on tag builds.
        required: false
        type: boolean
        default: false
    secrets:
      APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64:
        description: Base64-encoded Developer ID Application .p12 certificate.
        required: true
      APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD:
        description: Password for APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64.
        required: true
      APP_STORE_CONNECT_API_KEY_P8:
        description: App Store Connect API private key content for notarization.
        required: true
      APP_STORE_CONNECT_API_KEY_ID:
        description: App Store Connect API key ID.
        required: true
      APP_STORE_CONNECT_API_ISSUER_ID:
        description: App Store Connect issuer ID.
        required: true
      MACOS_CODESIGN_IDENTITY:
        description: Optional full Developer ID Application signing identity.
        required: false

jobs:
  build:
    name: Build Wails App
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Check out caller repository
        uses: actions/checkout@v6
        with:
          path: app

      - name: Check out workflow tools
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: gh-workflows

      - name: Set up Go from version file
        if: ${{ inputs.go-version-file != '' }}
        uses: actions/setup-go@v6
        with:
          go-version-file: app/${{ inputs.working-directory }}/${{ inputs.go-version-file }}
          check-latest: true

      - name: Set up Go
        if: ${{ inputs.go-version-file == '' }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.go-version }}
          check-latest: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Test workflow tools
        working-directory: gh-workflows
        run: go test ./...

      - name: Build Wails build CLI
        working-directory: gh-workflows
        run: go build -o "$RUNNER_TEMP/wails-build" ./wails/cmd/wails-build

      - name: Install Task
        run: |
          go install github.com/go-task/task/v3/cmd/task@${{ inputs.task-version }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest
          ln -sf "$(go env GOPATH)/bin/wails3" "$(go env GOPATH)/bin/wails"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build app bundle
        run: |
          "$RUNNER_TEMP/wails-build" \
            --working-directory "app/${{ inputs.working-directory }}" \
            --package-command "${{ inputs.package-command }}" \
            --app-path "${{ inputs.app-path }}" \
            --app-name "${{ inputs.app-name }}" \
            --bundle-id "${{ inputs.bundle-id }}" \
            --archive-path "$RUNNER_TEMP/wails-app.tar.gz"

      - name: Upload app bundle artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.artifact-name }}-app-bundle
          path: ${{ runner.temp }}/wails-app.tar.gz
          retention-days: 1

  sign-package-release:
    name: Sign, Package, and Notarize macOS App
    needs: build
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Check out caller repository
        uses: actions/checkout@v6
        with:
          path: app

      - name: Check out workflow tools
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: gh-workflows

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: gh-workflows/go.mod
          cache: false

      - name: Test workflow tools
        working-directory: gh-workflows
        run: go test ./...

      - name: Build macOS release CLI
        working-directory: gh-workflows
        run: go build -o "$RUNNER_TEMP/macos-release" ./mac/cmd/macos-release

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Download app bundle artifact
        uses: actions/download-artifact@v7.0.0
        with:
          name: ${{ inputs.artifact-name }}-app-bundle
          path: ${{ runner.temp }}/wails-app

      - name: Extract app bundle
        working-directory: app/${{ inputs.working-directory }}
        run: |
          "$RUNNER_TEMP/macos-release" extract-app \
            --archive-path "$RUNNER_TEMP/wails-app/wails-app.tar.gz" \
            --app-path "${{ inputs.app-path }}" \
            --destination .

      - name: Validate Apple signing secrets
        env:
          APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64 }}
          APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          "$RUNNER_TEMP/macos-release" validate-secrets

      - name: Install Apple Developer ID certificate
        env:
          APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64 }}
          APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          SIGNING_KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          "$RUNNER_TEMP/macos-release" install-certificate

      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          "$RUNNER_TEMP/macos-release" write-api-key

      - name: Sign app bundle
        working-directory: app/${{ inputs.working-directory }}
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          "$RUNNER_TEMP/macos-release" sign-app \
            --app-path "${{ inputs.app-path }}" \
            --app-name "${{ inputs.app-name }}" \
            --team-id "${{ inputs.team-id }}"

      - name: Notarize and staple app bundle
        working-directory: app/${{ inputs.working-directory }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          "$RUNNER_TEMP/macos-release" notarize-app \
            --app-path "${{ inputs.app-path }}" \
            --app-name "${{ inputs.app-name }}" \
            --team-id "${{ inputs.team-id }}"

      - name: Create signed DMG
        working-directory: app/${{ inputs.working-directory }}
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          "$RUNNER_TEMP/macos-release" create-dmg \
            --app-path "${{ inputs.app-path }}" \
            --app-name "${{ inputs.app-name }}" \
            --dmg-name "${{ inputs.dmg-name }}" \
            --team-id "${{ inputs.team-id }}"

      - name: Notarize and staple DMG
        working-directory: app/${{ inputs.working-directory }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          "$RUNNER_TEMP/macos-release" notarize-dmg \
            --dmg-name "${{ inputs.dmg-name }}"

      - name: Upload signed release artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: app/${{ inputs.working-directory }}/release/${{ inputs.dmg-name }}
          retention-days: 90

      - name: Upload GitHub release asset
        if: ${{ inputs.upload-github-release && startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v3.0.0
        with:
          files: app/${{ inputs.working-directory }}/release/${{ inputs.dmg-name }}
          prerelease: ${{ inputs.github-release-prerelease }}
          generate_release_notes: true
