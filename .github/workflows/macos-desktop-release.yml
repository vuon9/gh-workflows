name: macOS Desktop Release

on:
  workflow_call:
    inputs:
      app-name:
        description: Display name of the macOS app bundle.
        required: true
        type: string
      bundle-id:
        description: macOS app bundle identifier.
        required: true
        type: string
      team-id:
        description: Apple Developer Team ID.
        required: true
        type: string
      working-directory:
        description: Caller repository working directory.
        required: false
        type: string
        default: .
      package-command:
        description: Command that builds a release .app bundle.
        required: true
        type: string
      app-path:
        description: Path to the built .app bundle, relative to working-directory.
        required: true
        type: string
      dmg-name:
        description: DMG file name to create.
        required: true
        type: string
      artifact-name:
        description: GitHub Actions artifact name.
        required: false
        type: string
        default: macos-desktop-release
      runner-label:
        description: GitHub-hosted or self-hosted macOS runner label.
        required: false
        type: string
        default: macos-26
      go-version-file:
        description: Optional Go version file path relative to working-directory.
        required: false
        type: string
        default: ""
      go-version:
        description: Go version to install when go-version-file is not set.
        required: false
        type: string
        default: "1.25.0"
      bun-version:
        description: Bun version to install.
        required: false
        type: string
        default: latest
      upload-github-release:
        description: Upload the signed DMG to a GitHub Release on tag builds.
        required: false
        type: boolean
        default: true
    secrets:
      APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64:
        description: Base64-encoded Developer ID Application .p12 certificate.
        required: true
      APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD:
        description: Password for APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64.
        required: true
      APP_STORE_CONNECT_API_KEY_P8:
        description: App Store Connect API private key content for notarization.
        required: true
      APP_STORE_CONNECT_API_KEY_ID:
        description: App Store Connect API key ID.
        required: true
      APP_STORE_CONNECT_API_ISSUER_ID:
        description: App Store Connect issuer ID.
        required: true
      MACOS_CODESIGN_IDENTITY:
        description: Optional full Developer ID Application signing identity.
        required: false

jobs:
  release:
    name: Build, Sign, and Notarize macOS App
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Check out caller repository
        uses: actions/checkout@v6

      - name: Set up Go from version file
        if: ${{ inputs.go-version-file != '' }}
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ inputs.working-directory }}/${{ inputs.go-version-file }}
          check-latest: true

      - name: Set up Go
        if: ${{ inputs.go-version-file == '' }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.go-version }}
          check-latest: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Install Task
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest
          ln -sf "$(go env GOPATH)/bin/wails3" "$(go env GOPATH)/bin/wails"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Validate Apple signing secrets
        env:
          APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64 }}
          APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          missing=0
          for name in \
            APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64 \
            APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD \
            APP_STORE_CONNECT_API_KEY_P8 \
            APP_STORE_CONNECT_API_KEY_ID \
            APP_STORE_CONNECT_API_ISSUER_ID
          do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is required for signed and notarized macOS releases"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Install Apple Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          SIGNING_KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/developer-id-signing.keychain-db"

          security create-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$keychain_path"

          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          security import "$certificate_path" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$SIGNING_KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')

      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          private_keys_dir="$RUNNER_TEMP/private_keys"
          mkdir -p "$private_keys_dir"
          umask 077
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" > "$private_keys_dir/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$private_keys_dir/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Build app bundle
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.package-command }}

      - name: Validate app bundle metadata
        working-directory: ${{ inputs.working-directory }}
        env:
          APP_PATH: ${{ inputs.app-path }}
          APP_NAME: ${{ inputs.app-name }}
          BUNDLE_ID: ${{ inputs.bundle-id }}
        run: |
          test -d "$APP_PATH"
          plist="$APP_PATH/Contents/Info.plist"
          test -f "$plist"

          actual_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$plist")
          actual_bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")

          if [[ "$actual_name" != "$APP_NAME" ]]; then
            echo "::error::Expected CFBundleName '$APP_NAME', got '$actual_name'"
            exit 1
          fi

          if [[ "$actual_bundle_id" != "$BUNDLE_ID" ]]; then
            echo "::error::Expected CFBundleIdentifier '$BUNDLE_ID', got '$actual_bundle_id'"
            exit 1
          fi

      - name: Resolve signing identity
        id: signing
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          TEAM_ID: ${{ inputs.team-id }}
        run: |
          identity="$MACOS_CODESIGN_IDENTITY"
          if [[ -z "$identity" ]]; then
            identity=$(security find-identity -v -p codesigning | awk -v team="($TEAM_ID)" '/Developer ID Application/ && index($0, team) { sub(/^.*"Developer ID Application: /, "Developer ID Application: "); sub(/"$/, ""); print; exit }')
          fi

          if [[ -z "$identity" ]]; then
            echo "::error::Could not find Developer ID Application identity for team $TEAM_ID"
            security find-identity -v -p codesigning
            exit 1
          fi

          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Sign app bundle
        working-directory: ${{ inputs.working-directory }}
        env:
          APP_PATH: ${{ inputs.app-path }}
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          codesign \
            --force \
            --deep \
            --options runtime \
            --timestamp \
            --sign "$SIGNING_IDENTITY" \
            "$APP_PATH"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Notarize and staple app bundle
        working-directory: ${{ inputs.working-directory }}
        env:
          APP_PATH: ${{ inputs.app-path }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          notary_zip="$RUNNER_TEMP/${{ inputs.app-name }}-notary.zip"
          ditto -c -k --keepParent "$APP_PATH" "$notary_zip"

          xcrun notarytool submit "$notary_zip" \
            --key "$APP_STORE_CONNECT_API_KEY_PATH" \
            --key-id "$APP_STORE_CONNECT_API_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_API_ISSUER_ID" \
            --wait

          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"

      - name: Create signed DMG
        working-directory: ${{ inputs.working-directory }}
        env:
          APP_PATH: ${{ inputs.app-path }}
          APP_NAME: ${{ inputs.app-name }}
          DMG_NAME: ${{ inputs.dmg-name }}
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          mkdir -p release
          dmg_path="release/$DMG_NAME"

          create-dmg \
            --volname "$APP_NAME" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --app-drop-link 600 185 \
            "$dmg_path" \
            "$APP_PATH"

          codesign --force --timestamp --sign "$SIGNING_IDENTITY" "$dmg_path"
          codesign --verify --verbose=2 "$dmg_path"
          hdiutil verify "$dmg_path"

      - name: Notarize and staple DMG
        working-directory: ${{ inputs.working-directory }}
        env:
          DMG_NAME: ${{ inputs.dmg-name }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          dmg_path="release/$DMG_NAME"

          xcrun notarytool submit "$dmg_path" \
            --key "$APP_STORE_CONNECT_API_KEY_PATH" \
            --key-id "$APP_STORE_CONNECT_API_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_API_ISSUER_ID" \
            --wait

          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"
          spctl --assess --type open --verbose=4 "$dmg_path"

      - name: Upload signed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/release/${{ inputs.dmg-name }}
          retention-days: 90

      - name: Upload GitHub release asset
        if: ${{ inputs.upload-github-release && startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ inputs.working-directory }}/release/${{ inputs.dmg-name }}
          generate_release_notes: true
