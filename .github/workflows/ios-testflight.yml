name: iOS TestFlight

on:
  workflow_call:
    inputs:
      project-path:
        description: Path to the caller repository .xcodeproj. Mutually exclusive with workspace-path.
        required: false
        type: string
      workspace-path:
        description: Path to the caller repository .xcworkspace. Mutually exclusive with project-path.
        required: false
        type: string
      scheme:
        description: Xcode scheme to test, archive, and upload.
        required: true
        type: string
      team-id:
        description: Apple Developer Team ID.
        required: true
        type: string
      configuration:
        description: Xcode build configuration.
        required: false
        type: string
        default: Release
      test-destination:
        description: xcodebuild test destination.
        required: false
        type: string
        default: platform=iOS Simulator,name=iPhone 17
      archive-destination:
        description: xcodebuild archive destination.
        required: false
        type: string
        default: generic/platform=iOS
      export-method:
        description: ExportOptions.plist method.
        required: false
        type: string
        default: app-store-connect
      export-destination:
        description: ExportOptions.plist destination. Use export for release artifacts, upload for TestFlight.
        required: false
        type: string
        default: upload
      signing-style:
        description: ExportOptions.plist signing style.
        required: false
        type: string
        default: automatic
      bundle-id:
        description: Bundle ID for manual signing provisioning profile mapping.
        required: false
        type: string
      provisioning-profile:
        description: Provisioning profile name for manual signing.
        required: false
        type: string
      skip-tests:
        description: Skip simulator tests before archiving.
        required: false
        type: boolean
        default: false
      skip-archive:
        description: Skip archive and export an existing archive-path from a downloaded release artifact.
        required: false
        type: boolean
        default: false
      skip-cert-check:
        description: Skip the local Apple Distribution identity preflight check before archiving.
        required: false
        type: boolean
        default: false
      clean:
        description: Clean during archive.
        required: false
        type: boolean
        default: true
      dry-run:
        description: Print xcodebuild commands without executing them.
        required: false
        type: boolean
        default: false
      archive-path:
        description: Archive path to create or reuse.
        required: false
        type: string
        default: ""
      export-path:
        description: Export output path.
        required: false
        type: string
        default: build/TestFlight/export
      upload-artifact-name:
        description: Optional GitHub Actions artifact name to upload after archive/export.
        required: false
        type: string
        default: ""
      download-artifact-name:
        description: Optional GitHub Actions artifact name to download before export.
        required: false
        type: string
        default: ""
      runner-label:
        description: GitHub-hosted or self-hosted runner label. Use macos-26 or newer for App Store Connect uploads.
        required: false
        type: string
        default: macos-26
    secrets:
      APP_STORE_CONNECT_API_KEY_P8:
        description: App Store Connect API private key content.
        required: false
      APP_STORE_CONNECT_API_KEY_ID:
        description: App Store Connect API key ID.
        required: false
      APP_STORE_CONNECT_API_ISSUER_ID:
        description: App Store Connect issuer ID.
        required: false
      APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64:
        description: Base64-encoded Apple Distribution .p12 certificate for manual signing.
        required: false
      APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD:
        description: Password for APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64.
        required: false
      APPLE_DEVELOPMENT_CERTIFICATE_P12_BASE64:
        description: Base64-encoded Apple Development .p12 certificate for automatic signing archives.
        required: false
      APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD:
        description: Password for APPLE_DEVELOPMENT_CERTIFICATE_P12_BASE64.
        required: false
      APPLE_PROVISIONING_PROFILE_BASE64:
        description: Base64-encoded provisioning profile for manual signing.
        required: false

jobs:
  upload:
    name: Upload TestFlight Build
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 60

    steps:
      - name: Check out caller repository
        uses: actions/checkout@v6
        with:
          path: app

      - name: Check out workflow tools
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: gh-workflows

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: gh-workflows/go.mod
          cache: false

      - name: Test workflow tools
        working-directory: gh-workflows
        run: go test ./...

      - name: Build ios-testflight CLI
        working-directory: gh-workflows
        run: go build -o "$RUNNER_TEMP/ios-testflight" ./ios/testflight/cmd/ios-testflight

      - name: Download release artifact
        if: ${{ inputs.download-artifact-name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.download-artifact-name }}
          path: app/build/TestFlight

      - name: Install Apple signing assets
        if: ${{ !inputs.dry-run }}
        env:
          APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPMENT_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPMENT_CERTIFICATE_P12_BASE64 }}
          APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          SIGNING_STYLE: ${{ inputs.signing-style }}
          SIGNING_KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [[ "$SIGNING_STYLE" == "manual" && ( -z "$APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64" || -z "$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD" || -z "$APPLE_PROVISIONING_PROFILE_BASE64" ) ]]; then
            echo "Manual signing requires APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64, APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD, and APPLE_PROVISIONING_PROFILE_BASE64." >&2
            exit 1
          fi
          if [[ -z "$APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64" || -z "$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD" ]]; then
            echo "No Apple Distribution .p12 secret configured; skipping certificate import."
            exit 0
          fi

          distribution_certificate_path="$RUNNER_TEMP/apple-distribution.p12"
          development_certificate_path="$RUNNER_TEMP/apple-development.p12"
          profile_path="$RUNNER_TEMP/app-store.mobileprovision"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          profiles_dir="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"

          security create-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$keychain_path"

          printf '%s' "$APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64" | base64 -D > "$distribution_certificate_path"
          security import "$distribution_certificate_path" -P "$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"

          if [[ -n "$APPLE_DEVELOPMENT_CERTIFICATE_P12_BASE64" && -n "$APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD" ]]; then
            printf '%s' "$APPLE_DEVELOPMENT_CERTIFICATE_P12_BASE64" | base64 -D > "$development_certificate_path"
            security import "$development_certificate_path" -P "$APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          fi

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$SIGNING_KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')

          if [[ -n "$APPLE_PROVISIONING_PROFILE_BASE64" ]]; then
            printf '%s' "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 -D > "$profile_path"
            mkdir -p "$profiles_dir"
            uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<<"$(security cms -D -i "$profile_path")")
            cp "$profile_path" "$profiles_dir/$uuid.mobileprovision"
          fi

      - name: Write App Store Connect API key
        if: ${{ !inputs.dry-run }}
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          if [[ -z "$APP_STORE_CONNECT_API_KEY_P8" ]]; then
            echo "APP_STORE_CONNECT_API_KEY_P8 is required when dry-run is false." >&2
            exit 1
          fi
          umask 077
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Upload to TestFlight
        working-directory: app
        env:
          APP_STORE_CONNECT_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          if [[ "${{ inputs.dry-run }}" != "true" ]]; then
            if [[ -z "$APP_STORE_CONNECT_API_KEY_ID" || -z "$APP_STORE_CONNECT_API_ISSUER_ID" ]]; then
              echo "APP_STORE_CONNECT_API_KEY_ID and APP_STORE_CONNECT_API_ISSUER_ID are required when dry-run is false." >&2
              exit 1
            fi
          fi

          args=(
            --scheme "${{ inputs.scheme }}"
            --team-id "${{ inputs.team-id }}"
            --configuration "${{ inputs.configuration }}"
            --test-destination "${{ inputs.test-destination }}"
            --archive-destination "${{ inputs.archive-destination }}"
            --export-method "${{ inputs.export-method }}"
            --export-destination "${{ inputs.export-destination }}"
            --signing-style "${{ inputs.signing-style }}"
            --export-path "${{ inputs.export-path }}"
          )

          if [[ -n "${{ inputs.archive-path }}" ]]; then
            args+=(--archive-path "${{ inputs.archive-path }}")
          fi
          if [[ -n "${{ inputs.project-path }}" ]]; then
            args+=(--project "${{ inputs.project-path }}")
          fi
          if [[ -n "${{ inputs.workspace-path }}" ]]; then
            args+=(--workspace "${{ inputs.workspace-path }}")
          fi
          if [[ -n "${{ inputs.bundle-id }}" ]]; then
            args+=(--bundle-id "${{ inputs.bundle-id }}")
          fi
          if [[ -n "${{ inputs.provisioning-profile }}" ]]; then
            args+=(--provisioning-profile "${{ inputs.provisioning-profile }}")
          fi
          if [[ "${{ inputs.skip-tests }}" == "true" ]]; then
            args+=(--skip-tests)
          fi
          if [[ "${{ inputs.skip-archive }}" == "true" ]]; then
            args+=(--skip-archive)
          fi
          if [[ "${{ inputs.skip-cert-check }}" == "true" ]]; then
            args+=(--skip-cert-check)
          fi
          if [[ "${{ inputs.clean }}" == "true" ]]; then
            args+=(--clean)
          fi
          if [[ "${{ inputs.dry-run }}" == "true" ]]; then
            args+=(--dry-run)
          fi

          "$RUNNER_TEMP/ios-testflight" "${args[@]}"

      - name: Upload release artifact
        if: ${{ inputs.upload-artifact-name != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.upload-artifact-name }}
          path: app/build/TestFlight
          retention-days: 90
