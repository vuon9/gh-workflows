name: ai-code-review

# Reusable AI code review workflow.
#
# Call from any repo (permissions MUST live on the caller job; a
# permissions block inside the reusable job causes startup_failure):
#   jobs:
#     review:
#       permissions:
#         contents: read
#         pull-requests: write
#         issues: write
#       uses: vuon9/gh-workflows/.github/workflows/ai-code-review.yml@v0.4.3
#       with:
#         model: opencode/muse-spark-1.2-contributor-free  # optional, has default
#         prompt: "Custom review prompt"                    # optional
#         mode: pr                                           # optional: pr | comment
#         comment-marker: opencode-ai-review                # optional, hidden tag
#         opencode-version: 1.18.35                         # optional, must be 1.x
#       secrets:
#         OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}  # required
#
# mode=pr      → runs only for non-draft pull_request events
# mode=comment → runs only when the comment contains /oc or /opencode
#
# Comment upsert:
# opencode's `github run` posts a NEW comment on every run (it calls the
# issues.createComment API). This workflow adds a final step that converges to a
# SINGLE opencode comment per issue/PR: it keeps the OLDEST comment id (so the
# comment identity is stable across runs) and updates its body in place, deleting
# the comments from earlier runs. Re-runs edit the one comment instead of
# stacking, and a brand-new PR gets a fresh comment.
#
# Notes:
# - Uses the runner GITHUB_TOKEN (use_github_token: true), no GitHub App needed.
# - `issues: write` is required so the workflow can create, update, and delete
#   the PR conversation comment; `issues: read` is NOT enough.
# - Default model: opencode/muse-spark-1.2-contributor-free (free tier; the
#   non-free variant requires workspace credits).

on:
  workflow_call:
    inputs:
      model:
        description: Model to use for the review
        required: false
        type: string
        default: opencode/muse-spark-1.2-contributor-free
      prompt:
        description: Custom review prompt (defaults to a thorough review prompt)
        required: false
        type: string
        default: ''
      mode:
        description: pr (auto-review PRs) or comment (on-demand /oc /opencode)
        required: false
        type: string
        default: pr
      comment-marker:
        description: Hidden HTML comment tag used to track the workflow's comment
        required: false
        type: string
        default: opencode-ai-review
      opencode-version:
        description: >-
          opencode CLI version to install. Must be a 1.x release: the 2.x line
          (2.0.0 and later) removed the `github` subcommand this workflow calls.
        required: false
        type: string
        default: '1.18.35'
    secrets:
      OPENCODE_API_KEY:
        required: true

jobs:
  review:
    if: |
      (inputs.mode == 'pr' && github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (inputs.mode == 'comment' &&
       github.actor != 'github-actions[bot]' &&
       (github.event.issue.pull_request != null || github.event.pull_request != null) &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       (contains(github.event.comment.body, ' /oc') ||
        startsWith(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, ' /opencode') ||
        startsWith(github.event.comment.body, '/opencode') ||
        contains(github.event.review_comment.body, ' /oc') ||
        startsWith(github.event.review_comment.body, '/oc') ||
        contains(github.event.review_comment.body, ' /opencode') ||
        startsWith(github.event.review_comment.body, '/opencode')))
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      DEFAULT_PROMPT: |
        Review this pull request thoroughly:
        - Check for bugs, logic errors and edge cases
        - Look for security issues and unsafe patterns
        - Assess code quality, consistency and maintainability
        - Flag missing or weak tests
        - Suggest concrete improvements
        Post a clear, structured review comment with file references.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3
        with:
          # `opencode github run` checks out the PR head branch itself, and
          # falls back to `git fetch origin --depth=20 <branch>` when that
          # branch is not already in the clone. On a private repo that fetch
          # needs credentials, so the checkout keeps them; depth 20 usually
          # makes the fetch unnecessary in the first place.
          fetch-depth: 20
          persist-credentials: true

      - name: Prepare review prompt
        id: prompt
        shell: bash
        env:
          # Pass the prompt as an env var, not inline. A prompt often contains
          # backticks (markdown code spans); inline `PROMPT="${{ ... }}"` makes
          # bash run command substitution on those backticks and fail. As an env
          # var the text is literal.
          PROMPT_INPUT: ${{ inputs.prompt }}
        run: |
          PROMPT="$PROMPT_INPUT"
          if [ -z "$PROMPT" ]; then PROMPT="$DEFAULT_PROMPT"; fi
          printf '%s\n' "$PROMPT" > /tmp/review-prompt.txt
          {
            echo "value<<PROMPT_EOF"
            cat /tmp/review-prompt.txt
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      # Pin the CLI. `opencode.ai/install` resolves a mutable `latest` channel
      # that now serves the 2.x line from some edge nodes and the 1.x line from
      # others, so the same workflow and the same caller can get either one
      # minutes apart. The 2.x line has no `github` subcommand, so those runs die
      # with "Unexpected positional argument: run". Observed on 2026-10-10:
      # 15:40 resolved to 2.0.26 and failed, 15:49 resolved to 1.18.35 and passed.
      #
      # The install script also cannot fetch a 1.x version on request: it only
      # searches the `@opencode/cli-*` and `@opencode-ai/cli-*` scopes, while the
      # 1.x binaries ship as the unscoped `opencode-ai` package. So install from
      # npm directly instead of piping that script into bash.
      - name: Cache opencode
        id: cache
        uses: actions/cache@v5.0.5
        with:
          path: ~/.opencode-cli
          key: opencode-${{ runner.os }}-${{ runner.arch }}-${{ inputs.opencode-version }}

      - name: Install opencode
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install -g --prefix "$HOME/.opencode-cli" --no-audit --no-fund \
            "opencode-ai@${{ inputs.opencode-version }}"

      - name: Add opencode to PATH
        shell: bash
        run: echo "$HOME/.opencode-cli/bin" >> "$GITHUB_PATH"

      # Fail here with an actionable message, rather than deep inside the review
      # step, when the installed CLI does not match the contract this workflow
      # depends on.
      - name: Verify opencode has the github subcommand
        shell: bash
        run: |
          set -euo pipefail
          echo "opencode version: $(opencode --version)"
          if ! opencode --help 2>&1 | grep -q 'opencode github'; then
            echo "::error::opencode $(opencode --version) has no 'github' subcommand. The 2.x line removed it; set the opencode-version input to a 1.x release."
            exit 1
          fi

      - name: Run OpenCode review
        shell: bash
        id: run_opencode
        run: opencode github run
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL: ${{ inputs.model }}
          PROMPT: ${{ steps.prompt.outputs.value }}
          USE_GITHUB_TOKEN: "true"

      # opencode posts a NEW comment every run. Converge to a single opencode
      # comment so re-runs upsert instead of stacking: keep the OLDEST comment
      # id (stable identity), overwrite its body with the newest review, and
      # delete the duplicates from earlier runs. Runs even when opencode fails
      # so we never leave more than one comment.
      - name: Upsert review comment (keep one per issue/PR)
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          NUMBER="${{ github.event.issue.number || github.event.pull_request.number }}"
          MARKER="<!-- ${{ inputs.comment-marker }} -->"
          API="/repos/${OWNER}/${REPO}/issues/${NUMBER}/comments"

          if [ -z "$NUMBER" ]; then
            echo "No issue/PR number; skipping comment upsert."
            exit 0
          fi

          gh api "$API" --paginate > /tmp/all_comments.json 2>/dev/null \
            || { echo "Could not list comments; skipping."; exit 0; }

          # Every opencode comment ends with a "[github run](...)" footer, which
          # is the stable ownership signal (opencode always appends it).
          MINE=$(jq -c '[.[] | select(.body | contains("[github run](")) ] | sort_by(.created_at)' /tmp/all_comments.json)
          COUNT=$(echo "$MINE" | jq 'length')

          if [ "$COUNT" -eq 0 ]; then
            echo "No opencode comment found; nothing to converge."
            exit 0
          fi

          CANON_ID=$(echo "$MINE" | jq -r '.[0].id')
          NEWEST=$(echo "$MINE" | jq -r '.[-1]')
          NEWEST_BODY=$(echo "$NEWEST" | jq -r '.body')

          # Ensure the comment carries our hidden marker so we can track it by
          # content too. Prepend it only if it is not already there.
          if [[ "$NEWEST_BODY" != "$MARKER"* ]]; then
            NEWEST_BODY=$(printf '%s\n\n%s' "$MARKER" "$NEWEST_BODY")
          fi
          printf '%s' "$NEWEST_BODY" > /tmp/comment_body.txt

          # Update the canonical (oldest) comment in place.
          gh api --method PATCH "/repos/${OWNER}/${REPO}/issues/comments/${CANON_ID}" \
            -F body=@/tmp/comment_body.txt >/dev/null

          # Delete every other opencode comment except the canonical one.
          for ID in $(echo "$MINE" | jq -r '.[].id'); do
            if [ "$ID" != "$CANON_ID" ]; then
              gh api --method DELETE "/repos/${OWNER}/${REPO}/issues/comments/${ID}" >/dev/null 2>&1 || true
            fi
          done

          echo "Comment upserted: kept id ${CANON_ID}, removed $((COUNT - 1)) duplicate(s)."
