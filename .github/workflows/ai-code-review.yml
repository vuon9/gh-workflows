name: ai-code-review

# Reusable AI code review workflow.
#
# Call from any repo (permissions MUST live on the caller job; a
# permissions block inside the reusable job causes startup_failure):
#   jobs:
#     review:
#       permissions:
#         contents: read
#         pull-requests: write
#         issues: write
#       uses: vuon9/gh-workflows/.github/workflows/ai-code-review.yml@v0.4.3
#       with:
#         model: deepseek/deepseek-flash  # optional, has default
#         variant: minimal                                  # optional, reasoning effort
#         prompt: "Custom review prompt"                    # optional
#         mode: pr                                           # optional: pr | comment
#         comment-marker: opencode-ai-review                # optional, hidden tag
#         opencode-version: 1.18.35                         # optional, must be 1.x
#       secrets:
#         OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}  # required
#
# mode=pr      → runs only for non-draft pull_request events
# mode=comment → runs only when the comment contains /oc or /opencode
#
# Visibility:
# The review takes minutes. Before it starts, a placeholder comment carrying the
# marker is posted so the PR shows the bot is working. The final upsert edits
# that same comment, so a finished run leaves exactly one comment.
#
# Tool lockdown:
# The PR body and diff are untrusted input, and this job holds DEEPSEEK_API_KEY
# and GITHUB_TOKEN. Before the review, the workflow writes an opencode config
# that denies bash, webfetch and websearch, so the reviewer can read the
# checkout and post its comment but cannot run a command or fetch a URL.
#
# Comment upsert:
# opencode's `github run` posts a NEW comment on every run (it calls the
# issues.createComment API). This workflow adds a final step that converges to a
# SINGLE opencode comment per issue/PR: it keeps the OLDEST comment id (so the
# comment identity is stable across runs) and updates its body in place, deleting
# the comments from earlier runs. Re-runs edit the one comment instead of
# stacking, and a brand-new PR gets a fresh comment.
#
# Notes:
# - Uses the runner GITHUB_TOKEN (use_github_token: true), no GitHub App needed.
# - `issues: write` is required so the workflow can create, update, and delete
#   the PR conversation comment; `issues: read` is NOT enough.
# - Default model: deepseek/deepseek-flash, which needs the DEEPSEEK_API_KEY
#   secret. The opencode/* models need OPENCODE_API_KEY instead, but opencode's
#   free tier is exhausted from shared runner IPs and its paid models need a
#   subscription, so DeepSeek is the default. Run `opencode models` to list what
#   a key can reach before pinning a model.

on:
  workflow_call:
    inputs:
      model:
        description: Model to use for the review
        required: false
        type: string
        default: deepseek/deepseek-flash
      variant:
        description: >-
          Provider reasoning effort, passed to opencode as VARIANT. Values are
          provider specific (for example minimal, low, medium, high). An empty
          string leaves the provider default.
        required: false
        type: string
        default: minimal
      prompt:
        description: Custom review prompt (defaults to a thorough review prompt)
        required: false
        type: string
        default: ''
      mode:
        description: pr (auto-review PRs) or comment (on-demand /oc /opencode)
        required: false
        type: string
        default: pr
      comment-marker:
        description: Hidden HTML comment tag used to track the workflow's comment
        required: false
        type: string
        default: opencode-ai-review
      opencode-version:
        description: >-
          opencode CLI version to install. Must be a 1.x release: the 2.x line
          (2.0.0 and later) removed the `github` subcommand this workflow calls.
        required: false
        type: string
        default: '1.18.35'
    secrets:
      # Either key works: a DeepSeek key drives the deepseek/* models and needs
      # no subscription, an OpenCode key drives the opencode/* models.
      OPENCODE_API_KEY:
        required: false
      DEEPSEEK_API_KEY:
        required: false

jobs:
  review:
    if: |
      (inputs.mode == 'pr' && github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (inputs.mode == 'comment' &&
       github.actor != 'github-actions[bot]' &&
       (github.event.issue.pull_request != null || github.event.pull_request != null) &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       (contains(github.event.comment.body, ' /oc') ||
        startsWith(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, ' /opencode') ||
        startsWith(github.event.comment.body, '/opencode') ||
        contains(github.event.review_comment.body, ' /oc') ||
        startsWith(github.event.review_comment.body, '/oc') ||
        contains(github.event.review_comment.body, ' /opencode') ||
        startsWith(github.event.review_comment.body, '/opencode')))
    timeout-minutes: 25
    runs-on: ubuntu-latest
    env:
      DEFAULT_PROMPT: |
        Review this pull request thoroughly:
        - Check for bugs, logic errors and edge cases
        - Look for security issues and unsafe patterns
        - Assess code quality, consistency and maintainability
        - Flag missing or weak tests
        - Suggest concrete improvements
        Post a clear, structured review comment with file references.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3
        with:
          # `opencode github run` checks out the PR head branch itself, and
          # falls back to `git fetch origin --depth=20 <branch>` when that
          # branch is not already in the clone. On a private repo that fetch
          # needs credentials, so the checkout keeps them; depth 20 usually
          # makes the fetch unnecessary in the first place.
          fetch-depth: 20
          persist-credentials: true

      - name: Prepare review prompt
        id: prompt
        shell: bash
        env:
          # Pass the prompt as an env var, not inline. A prompt often contains
          # backticks (markdown code spans); inline `PROMPT="${{ ... }}"` makes
          # bash run command substitution on those backticks and fail. As an env
          # var the text is literal.
          PROMPT_INPUT: ${{ inputs.prompt }}
        run: |
          PROMPT="$PROMPT_INPUT"
          if [ -z "$PROMPT" ]; then PROMPT="$DEFAULT_PROMPT"; fi
          printf '%s\n' "$PROMPT" > /tmp/review-prompt.txt
          {
            echo "value<<PROMPT_EOF"
            cat /tmp/review-prompt.txt
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      # Pin the CLI. `opencode.ai/install` resolves a mutable `latest` channel
      # that now serves the 2.x line from some edge nodes and the 1.x line from
      # others, so the same workflow and the same caller can get either one
      # minutes apart. The 2.x line has no `github` subcommand, so those runs die
      # with "Unexpected positional argument: run". Observed on 2026-10-10:
      # 15:40 resolved to 2.0.26 and failed, 15:49 resolved to 1.18.35 and passed.
      #
      # The install script also cannot fetch a 1.x version on request: it only
      # searches the `@opencode/cli-*` and `@opencode-ai/cli-*` scopes, while the
      # 1.x binaries ship as the unscoped `opencode-ai` package. So install from
      # npm directly instead of piping that script into bash.
      - name: Cache opencode
        id: cache
        uses: actions/cache@v5.0.5
        with:
          path: ~/.opencode-cli
          key: opencode-${{ runner.os }}-${{ runner.arch }}-${{ inputs.opencode-version }}

      - name: Install opencode
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install -g --prefix "$HOME/.opencode-cli" --no-audit --no-fund \
            "opencode-ai@${{ inputs.opencode-version }}"

      - name: Add opencode to PATH
        shell: bash
        run: echo "$HOME/.opencode-cli/bin" >> "$GITHUB_PATH"

      # Fail here with an actionable message, rather than deep inside the review
      # step, when the installed CLI does not match the contract this workflow
      # depends on.
      - name: Verify opencode has the github subcommand
        shell: bash
        run: |
          set -euo pipefail
          echo "opencode version: $(opencode --version)"
          if ! opencode --help 2>&1 | grep -q 'opencode github'; then
            echo "::error::opencode $(opencode --version) has no 'github' subcommand. The 2.x line removed it; set the opencode-version input to a 1.x release."
            exit 1
          fi

      # A missing key used to surface as a provider error after the job had
      # already spent a minute installing opencode, or worse, as a silent fall
      # back to a free tier that shared runner IPs have always exhausted.
      - name: Check the model has a key
        shell: bash
        env:
          MODEL: ${{ inputs.model }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          case "$MODEL" in
            deepseek/*)   key="${DEEPSEEK_API_KEY:-}"; want="DEEPSEEK_API_KEY" ;;
            opencode*/*)  key="${OPENCODE_API_KEY:-}"; want="OPENCODE_API_KEY" ;;
            *)            key="present"; want="" ;;
          esac
          if [ -z "$key" ]; then
            echo "::error::model $MODEL needs the $want secret, which this repository does not set."
            exit 1
          fi

      - name: Post review placeholder
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          MARKER: "<!-- ${{ inputs.comment-marker }} -->"
        run: |
          set -euo pipefail

          API="/repos/${OWNER}/${REPO}/issues/${NUMBER}/comments"

          if [ -z "$NUMBER" ]; then
            echo "No issue/PR number; skipping placeholder."
            exit 0
          fi

          # The marker is what the upsert step below uses to find this comment.
          # Write the body to a file so the text stays literal.
          STARTING="**AI review starting.** opencode is reviewing this pull"
          STARTING="$STARTING request. This comment will be replaced with the"
          STARTING="$STARTING review when it finishes."
          printf '%s\n\n%s\n' "$MARKER" "$STARTING" > /tmp/placeholder_body.txt
          gh api --method POST "$API" \
            -F body=@/tmp/placeholder_body.txt >/dev/null

      # The PR body and diff are untrusted input, so a prompt injection could
      # try to get the reviewer to read DEEPSEEK_API_KEY or GITHUB_TOKEN. Deny
      # the tools that execute or fetch: bash, webfetch, websearch. Verified
      # against opencode 1.18.35, whose `permission` config takes these keys
      # with allow, ask or deny.
      - name: Lock down review tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/opencode"
          cat > "$HOME/.config/opencode/opencode.json" <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "permission": {
              "bash": "deny",
              "webfetch": "deny",
              "websearch": "deny"
            }
          }
          JSON

      - name: Run OpenCode review
        shell: bash
        id: run_opencode
        run: opencode github run
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL: ${{ inputs.model }}
          VARIANT: ${{ inputs.variant }}
          PROMPT: ${{ steps.prompt.outputs.value }}
          USE_GITHUB_TOKEN: "true"
          # opencode merges this env var after config, so it holds even if the
          # global file is missing or changed. A project opencode.json could
          # still redefine the build agent's permissions, which is why project
          # config is disabled below. Model and prompt come in as inputs, so
          # the review does not need project config.
          OPENCODE_PERMISSION: >-
            {"bash":"deny","webfetch":"deny","websearch":"deny"}
          OPENCODE_DISABLE_PROJECT_CONFIG: "1"

      # opencode posts a NEW comment every run. Converge to a single opencode
      # comment so re-runs upsert instead of stacking: keep the OLDEST comment
      # id (stable identity), overwrite its body with the newest review, and
      # delete the duplicates from earlier runs. Runs even when opencode fails
      # so we never leave more than one comment.
      - name: Upsert review comment (keep one per issue/PR)
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          MARKER: "<!-- ${{ inputs.comment-marker }} -->"
        run: |
          set -euo pipefail

          API="/repos/${OWNER}/${REPO}/issues/${NUMBER}/comments"

          if [ -z "$NUMBER" ]; then
            echo "No issue/PR number; skipping comment upsert."
            exit 0
          fi

          gh api "$API" --paginate > /tmp/all_comments.json 2>/dev/null \
            || { echo "Could not list comments; skipping."; exit 0; }

          # Track two kinds of comment: the placeholder carrying our marker, and
          # the review opencode posts, which always ends with a
          # "[github run](...)" footer. The placeholder is older, so it becomes
          # the canonical comment and the final review is edited into it.
          MINE=$(jq -c --arg marker "$MARKER" '
            [.[] | select((.body | contains($marker))
              or (.body | contains("[github run](")))]
            | sort_by(.created_at)' /tmp/all_comments.json)
          COUNT=$(echo "$MINE" | jq 'length')

          if [ "$COUNT" -eq 0 ]; then
            echo "No tracked comment found; nothing to converge."
            exit 0
          fi

          CANON_ID=$(echo "$MINE" | jq -r '.[0].id')
          NEWEST=$(echo "$MINE" | jq -r '.[-1]')
          NEWEST_BODY=$(echo "$NEWEST" | jq -r '.body')
          HAS_REVIEW=$(echo "$NEWEST" \
            | jq -r '.body | contains("[github run](")')

          if [ "$HAS_REVIEW" = "false" ]; then
            # opencode posted no review, so the newest comment is still the
            # placeholder. Replace "starting" with the outcome instead of
            # leaving a stale status on the PR.
            NOT_FINISHED="**AI review did not finish.** opencode posted no"
            NOT_FINISHED="$NOT_FINISHED review. See the workflow run."
            NEWEST_BODY=$(printf '%s\n\n%s' "$MARKER" "$NOT_FINISHED")
          elif [[ "$NEWEST_BODY" != "$MARKER"* ]]; then
            # Ensure the comment carries our hidden marker so the next run can
            # find it. Prepend it only if it is not already there.
            NEWEST_BODY=$(printf '%s\n\n%s' "$MARKER" "$NEWEST_BODY")
          fi
          printf '%s' "$NEWEST_BODY" > /tmp/comment_body.txt

          # Update the canonical (oldest) comment in place.
          gh api --method PATCH \
            "/repos/${OWNER}/${REPO}/issues/comments/${CANON_ID}" \
            -F body=@/tmp/comment_body.txt >/dev/null

          # Delete every other opencode comment except the canonical one.
          for ID in $(echo "$MINE" | jq -r '.[].id'); do
            if [ "$ID" != "$CANON_ID" ]; then
              gh api --method DELETE \
                "/repos/${OWNER}/${REPO}/issues/comments/${ID}" \
                >/dev/null 2>&1 || true
            fi
          done

          echo "Comment upserted: kept id ${CANON_ID}," \
            "removed $((COUNT - 1)) duplicate(s)."
